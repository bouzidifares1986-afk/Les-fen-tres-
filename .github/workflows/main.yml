name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          W=$PWD
          mkdir -p /tmp/p
          find . -name '*.zip' -not -path './.git/*' -print0 | while IFS= read -r -d '' z; do unzip -oq "$z" -d /tmp/p; done
          S=$(find . /tmp/p -name settings.gradle.kts -not -path './.git/*' | head -n1)
          if [ -z "$S" ]; then echo "NO PROJECT FOUND: upload roofwin zip"; ls -R . | head -50; exit 1; fi
          cd "$(dirname "$S")"
          gradle assembleDebug
          mkdir -p "$W/out"
          find . -path '*outputs/apk/debug*' -name '*.apk' -exec cp {} "$W/out/" \;
      - uses: actions/upload-artifact@v4
        with:
          name: RoofWin-debug
          path: out/*.apk
